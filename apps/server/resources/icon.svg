<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <linearGradient id="queezThemeGrad" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#77a6b6"/>
      <stop offset="45%" stop-color="#4d7298"/>
      <stop offset="100%" stop-color="#233748"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle (Q head) -->
  <circle cx="250" cy="186" r="96" stroke="url(#queezThemeGrad)" stroke-width="21" stroke-linecap="round" />

  <!-- Inner Hook (? top) sweeping down into right diagonal -->
  <path d="M 196 195 A 54 54 0 0 1 304 186 C 304 214 290 238 274 262 L 222 344" 
        stroke="url(#queezThemeGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The Z: top bar, left diagonal, and bottom bar -->
  <path d="M 198 238 L 246 238 L 184 344 L 322 344" 
        stroke="url(#queezThemeGrad)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Q Tail: sweeping out to the right -->
  <path d="M 268 262 C 290 280 318 284 344 278" 
        stroke="url(#queezThemeGrad)" stroke-width="21" stroke-linecap="round" />

  <!-- ? Dot: centered beneath the bottom bar of Z -->
  <circle cx="250" cy="386" r="13.5" fill="url(#queezThemeGrad)" />
</svg>